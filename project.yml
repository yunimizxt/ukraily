name: Ukraily
options:
  bundleIdPrefix: com.ukraily
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

targets:

  Ukraily:
    type: application
    platform: iOS
    sources:
      - path: Sources/UkrailyApp
      - path: Sources/UkrailyCore
    resources:
      - Sources/UkrailyApp/Resources
      - Sources/UkrailyCore/Utilities/Stations.json
    info:
      path: Sources/UkrailyApp/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        DarwinAPIKey: $(DARWIN_API_KEY)
        BGTaskSchedulerPermittedIdentifiers:
          - com.ukraily.refresh
        NSUserNotificationsUsageDescription: "Ukraily notifies you about delays, platform changes, and departure reminders."
        NSLocationWhenInUseUsageDescription: "Used to suggest nearby stations."
    entitlements:
      path: Sources/UkrailyApp/Ukraily.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ukraily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ukraily.app

  UkrailyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/UkrailyWidgets
      - path: Sources/UkrailyCore/Models/TrackedJourneySnapshot.swift
      - path: Sources/UkrailyCore/Utilities/SharedDataStore.swift
    info:
      path: Sources/UkrailyWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/UkrailyWidgets/UkrailyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ukraily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ukraily.app.widgets

  UkrailyWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/UkrailyWatch
      - path: Sources/UkrailyCore/Models/TrackedJourneySnapshot.swift
      - path: Sources/UkrailyCore/Utilities/SharedDataStore.swift
    info:
      path: Sources/UkrailyWatch/Info.plist
      properties:
        WKWatchOnly: true
    entitlements:
      path: Sources/UkrailyWatch/UkrailyWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ukraily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ukraily.watch

  UkrailyWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/UkrailyWatchWidget
      - path: Sources/UkrailyCore/Models/TrackedJourneySnapshot.swift
      - path: Sources/UkrailyCore/Utilities/SharedDataStore.swift
    info:
      path: Sources/UkrailyWatchWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WKExtensionDelegateClassName: ""
    entitlements:
      path: Sources/UkrailyWatchWidget/UkrailyWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ukraily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ukraily.watch.widget
